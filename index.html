  .num{font-variant-numeric:tabular-nums}
  .foot{color:var(--mut);font-size:12px;margin-top:14px;line-height:1.6}

let curTheme = "전체", sortK = "c1", sortDir = -1, q = "";

// ---- market status (HK: Mon-Fri 09:30-12:00, 13:00-16:00 HKT = UTC+8) ----
function marketStatus(){
  const now = new Date();
  const hk = new Date(now.getTime() + (now.getTimezoneOffset()*60000) + 8*3600000);
  const day = hk.getDay(), mins = hk.getHours()*60 + hk.getMinutes();
  if(day===0||day===6) return ["장마감 (주말)","closed"];
  if(mins>=570 && mins<720) return ["장중","open"];
  if(mins>=720 && mins<780) return ["점심 휴장","lunch"];
  if(mins>=780 && mins<960) return ["장중","open"];
  return ["장마감","closed"];
}
function applyMarket(){
  const [t,c] = marketStatus();
  const el = document.getElementById("market");
  el.textContent = t; el.className = "badge "+c;
}

function fmtPct(v){
  if(v===null||v===undefined) return '<span class="flat">–</span>';
  const cls = v>0?"up":(v<0?"dn":"flat");
  const sign = v>0?"+":"";
  return `<span class="${cls} num">${sign}${v.toFixed(2)}%</span>`;
}
function fmtCur(v){ return v===null||v===undefined ? '<span class="flat">–</span>' : `<span class="num">${v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:3})}</span>`; }

function renderChips(){
  const box = document.getElementById("chips");
  const all = [{name:"전체",n:DATA.rows.length}].concat(DATA.themes);
  box.innerHTML = all.map(t=>
    `<span class="chip ${t.name===curTheme?'on':''}" data-t="${t.name}">${t.name}<span class="n">${t.n}</span></span>`).join("");
  box.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{curTheme=c.dataset.t;renderChips();renderRows();});
}

function rowsView(){
  let r = DATA.rows.filter(x=>curTheme==="전체"||x.theme===curTheme);
  if(q){ const s=q.toLowerCase(); r=r.filter(x=>x.code.includes(s)||(x.name||"").toLowerCase().includes(s)); }
  r.sort((a,b)=>{
    let va=a[sortK], vb=b[sortK];
    if(sortK==="code"||sortK==="name"||sortK==="theme"){ va=(va||"");vb=(vb||""); return sortDir*va.localeCompare(vb); }
    if(va===null||va===undefined) return 1; if(vb===null||vb===undefined) return -1;
    return sortDir*(va-vb);
  });
  return r;
}

function renderRows(){
  const r = rowsView();
  document.getElementById("tb").innerHTML = r.map(x=>`<tr>
    <td class="l"><a class="code" href="https://www.gate.com/stocks/${x.code}" target="_blank">${x.code}</a></td>
    <td class="l nm">${x.name||""}</td>
    <td class="l"><span class="th">${x.theme}</span></td>
    <td>${fmtCur(x.cur)}</td>
    <td>${fmtPct(x.c4)}</td>
    <td>${fmtPct(x.c1)}</td>
    <td>${fmtPct(x.c5)}</td>
    <td>${fmtPct(x.gate)}</td>
  </tr>`).join("");
  document.getElementById("count").textContent = `${r.length}개 표시`;
  document.querySelectorAll("thead th").forEach(th=>th.classList.toggle("sorted",th.dataset.k===sortK));
}

document.querySelectorAll("thead th").forEach(th=>th.onclick=()=>{
  const k=th.dataset.k;
  if(sortK===k) sortDir*=-1; else { sortK=k; sortDir=(k==="code"||k==="name"||k==="theme")?1:-1; }
  renderRows();
});
document.getElementById("q").oninput = e=>{ q=e.target.value.trim(); renderRows(); };

  `코드 클릭 시 Gate 거래페이지로 이동`;
